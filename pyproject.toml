[project]
name = "sanityops_agent"
version = "0.1.1"
description = "A modular, extensible AI Agent framework with multi-provider support and plugin architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "sanityops", email = "hello@sanityops.org"}
]
keywords = ["ai", "agent", "llm", "openai", "anthropic", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.39",
    "google-genai>=1.0",
]

[project.urls]
Homepage = "https://github.com/sanityops-org/sanityops_agent"
Repository = "https://github.com/sanityops-org/sanityops_agent"
Documentation = "https://github.com/sanityops-org/sanityops_agent#readme"
Issues = "https://github.com/sanityops-org/sanityops_agent/issues"
Changelog = "https://github.com/sanityops-org/sanityops_agent/releases"
Source = "https://github.com/sanityops-org/sanityops_agent"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sanityops_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B027",   # empty method without abstract decorator (design choice)
    "B904",   # raise from err (requires manual fix)
]

[tool.ruff.lint.isort]
known-first-party = ["sanityops_agent"]
