name: Publish to PyPI

on:
  push:
    branches: [main]
    paths: ['pyproject.toml']
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  id-token: write # Required for PyPI trusted publisher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need to compare with previous commit

      - name: Check version changed
        id: version-check
        run: |
          # Get current version
          CURRENT_VERSION=$(grep -m1 'version = "' pyproject.toml | cut -d'"' -f2)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check if pyproject.toml was modified in this commit
          if git diff --name-only HEAD~1 HEAD | grep -q "pyproject.toml"; then
            # Check if version number actually changed
            git show HEAD~1:pyproject.toml > /tmp/old_pyproject.toml 2>/dev/null || echo "" > /tmp/old_pyproject.toml
            OLD_VERSION=$(grep -m1 'version = "' /tmp/old_pyproject.toml 2>/dev/null | cut -d'"' -f2 || echo "")

            if [ "$CURRENT_VERSION" != "$OLD_VERSION" ]; then
              echo "version_changed=true" >> $GITHUB_OUTPUT
              echo "Version changed: $OLD_VERSION -> $CURRENT_VERSION"
            else
              echo "version_changed=false" >> $GITHUB_OUTPUT
              echo "Version not changed, skipping publish"
            fi
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "pyproject.toml not modified in this commit, skipping publish"
          fi

      - name: Setup Python
        if: steps.version-check.outputs.version_changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        if: steps.version-check.outputs.version_changed == 'true'
        run: pip install build

      - name: Build package
        if: steps.version-check.outputs.version_changed == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.version-check.outputs.version_changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1